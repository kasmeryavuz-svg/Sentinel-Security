# Checkpoint 19E independent GitHub CI.
# This workflow verifies the existing safety/build suite on pull_request.
# It is not production signing, artifact-identity, trigger, or hardware
# authorization. Unsigned release outputs stay local to the runner.
#
# Action pins were resolved from the official GitHub repositories:
# - https://github.com/actions/checkout/releases/tag/v7.0.1
# - https://github.com/gradle/actions/releases/tag/v6.3.0
# - https://github.com/actions/setup-java/releases/tag/v5.7.0
# Annotated tags are peeled to the immutable commit object.

name: Checkpoint 19E independent CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  attestations: none
  checks: none
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-safety-verification:
    name: Independent safety verification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Refuse populated production-signing environment variables
        run: |
          set -eu
          failed=0
          for name in \
            SENTINEL_RELEASE_STORE_FILE \
            SENTINEL_RELEASE_STORE_PASSWORD \
            SENTINEL_RELEASE_KEY_ALIAS \
            SENTINEL_RELEASE_KEY_PASSWORD \
            SENTINEL_RELEASE_CERT_SHA256
          do
            if [ -n "${!name:-}" ]; then
              echo "Unexpected production-signing environment variable is populated: ${name}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "Independent CI must not run while production-signing variables are populated."
            exit 1
          fi

      - name: Refuse populated validation-signing environment variables
        run: |
          set -eu
          failed=0
          for name in \
            SENTINEL_VALIDATION_STORE_FILE \
            SENTINEL_VALIDATION_STORE_PASSWORD \
            SENTINEL_VALIDATION_KEY_ALIAS \
            SENTINEL_VALIDATION_KEY_PASSWORD \
            SENTINEL_VALIDATION_CERT_SHA256
          do
            if [ -n "${!name:-}" ]; then
              echo "Unexpected validation-signing environment variable is populated: ${name}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "Independent CI must not run while validation-signing variables are populated."
            exit 1
          fi

      - name: Install required Android SDK packages
        run: |
          set -eu
          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools.zip" | sha256sum -c -
          rm -rf /tmp/cmdline-tools-unpack
          mkdir -p /tmp/cmdline-tools-unpack
          unzip -q /tmp/commandlinetools.zip -d /tmp/cmdline-tools-unpack
          mv /tmp/cmdline-tools-unpack/cmdline-tools "${SDK_ROOT}/cmdline-tools/15859902"
          rm -f /tmp/commandlinetools.zip
          rm -rf /tmp/cmdline-tools-unpack
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/15859902/bin/sdkmanager"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export ANDROID_HOME="${SDK_ROOT}"
          set +e
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/tmp/sdk-licenses.log 2>&1
          set -e
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install \
            "platforms;android-36" \
            "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "${SDK_ROOT}" > "${GITHUB_WORKSPACE}/local.properties"
          if grep -qE '^[[:space:]]*SENTINEL_(RELEASE|VALIDATION)_' "${GITHUB_WORKSPACE}/local.properties"; then
            echo "local.properties must not contain production-signing or validation-signing keys"
            exit 1
          fi

      - name: Run the complete independent safety and build suite
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        run: |
          set -eu
          ./gradlew --no-daemon --stacktrace \
            :buildSrc:test \
            test \
            checkProductionBytecodePolicy \
            :app:checkAppApiCompileNegative \
            :app:checkAppDependencyIsolation \
            :app:checkDebugEffectiveDeviceAdminMetadata \
            :app:checkReleaseEffectiveDeviceAdminMetadata \
            :app:checkDisposableValidationEffectiveDeviceAdminMetadata \
            :app:checkDebugProductionBytecodePolicy \
            :app:checkReleaseProductionBytecodePolicy \
            :app:checkDisposableValidationProductionBytecodePolicy \
            assembleDebug \
            assembleRelease \
            assembleDisposableValidation \
            :app:checkUnsignedDestructiveValidationCandidateEvidence \
            :app:checkUnsignedDisposableValidationBuildPurposeEvidence \
            :app:checkDestructiveSigningCeremonyPreparation \
            :app:checkIndependentWitnessVerificationContract \
            bundleRelease \
            checkReleaseProductionSecurity \
            checkReleaseBundleProductionSecurity \
            :sensitive-actions:test \
            :sensitive-actions:checkMainProductionBytecodePolicy

      - name: Prove release outputs remain UNSIGNED local verification artifacts
        run: |
          set -eu
          apk_report=app/build/reports/release-signing-boundary.txt
          aab_report=app/build/reports/release-bundle-security.txt
          test -f "${apk_report}"
          test -f "${aab_report}"
          grep -qx 'signing=UNSIGNED' "${apk_report}"
          grep -qx 'signing=UNSIGNED' "${aab_report}"
          grep -F 'This artifact is unsigned and is not a production distribution.' "${apk_report}"
          grep -F 'This artifact is unsigned and is not a production distribution.' "${aab_report}"

      - name: Prove the unsigned candidate remains ineligible and untrusted
        run: |
          set -eu
          candidate_report=app/build/reports/destructive-validation-candidate.txt
          test -f "${candidate_report}"
          grep -qx 'authority=UNTRUSTED_CANDIDATE_ONLY' "${candidate_report}"
          grep -qx 'candidate_status=INELIGIBLE' "${candidate_report}"
          grep -qx 'signing=UNSIGNED' "${candidate_report}"
          grep -qx 'runtime_authorization=false' "${candidate_report}"
          grep -qx 'trusted_expectation_minted=false' "${candidate_report}"
          grep -qx 'production_signing_enabled=false' "${candidate_report}"
          grep -qx 'hardware_validation_approved=false' "${candidate_report}"
          grep -qx 'build_purpose_observed=UNAVAILABLE' "${candidate_report}"

      - name: Prove the disposable-validation APK exposes purpose and stays ineligible
        run: |
          set -eu
          purpose_report=app/build/reports/destructive-validation-disposable-purpose.txt
          test -f "${purpose_report}"
          grep -qx 'authority=UNTRUSTED_CANDIDATE_ONLY' "${purpose_report}"
          grep -qx 'candidate_status=INELIGIBLE' "${purpose_report}"
          grep -qx 'signing=UNSIGNED' "${purpose_report}"
          grep -qx 'runtime_authorization=false' "${purpose_report}"
          grep -qx 'trusted_expectation_minted=false' "${purpose_report}"
          grep -qx 'expected_certificate_configured=false' "${purpose_report}"
          grep -qx 'production_signing_enabled=false' "${purpose_report}"
          grep -qx 'hardware_validation_approved=false' "${purpose_report}"
          grep -qx 'build_purpose_expected=DISPOSABLE_DEVICE_VALIDATION' "${purpose_report}"
          grep -qx 'build_purpose_observed=DISPOSABLE_DEVICE_VALIDATION' "${purpose_report}"
          grep -qx 'build_purpose_matches=true' "${purpose_report}"
          test ! -e app/build/tmp/destructive-validation-disposable-purpose-snapshot/immutable-candidate-snapshot.apk

      - name: Prove signing-ceremony preparation remains NOT_READY
        run: |
          set -eu
          ceremony_report=app/build/reports/destructive-signing-ceremony-preparation.txt
          test -f "${ceremony_report}"
          grep -qx 'ceremony_status=NOT_READY' "${ceremony_report}"
          grep -qx 'offline_key_generated=false' "${ceremony_report}"
          grep -qx 'public_certificate_supplied=false' "${ceremony_report}"
          grep -qx 'expected_certificate_recorded=false' "${ceremony_report}"
          grep -qx 'operator_approval_available=false' "${ceremony_report}"
          grep -qx 'witness_approval_available=false' "${ceremony_report}"
          grep -qx 'key_custody_approved=false' "${ceremony_report}"
          grep -qx 'recovery_backup_verified=false' "${ceremony_report}"
          grep -qx 'branch_protection_required_check_verified=false' "${ceremony_report}"
          grep -qx 'production_artifact_signed=false' "${ceremony_report}"
          grep -qx 'runtime_authorization=false' "${ceremony_report}"
          grep -qx 'trusted_expectation_minted=false' "${ceremony_report}"
          grep -qx 'signed_validation_candidate_produced=false' "${ceremony_report}"
          grep -qx 'expected_certificate_sha256_configured=false' "${ceremony_report}"
          grep -qx 'checkout_revision_proves_apk_origin=false' "${ceremony_report}"
          grep -q 'missing_ceremony_identifier' "${ceremony_report}"
          grep -q 'production_signing_not_authorized' "${ceremony_report}"
          if grep -qE '\b[0-9a-fA-F]{64}\b' "${ceremony_report}"; then
            echo "Preparation report must not contain a digest value"
            exit 1
          fi
          test ! -e app/build/tmp/destructive-signing-ceremony-preparation
          test ! -e local/destructive-signing-ceremony-record.txt

      - name: Prove independent-witness verification remains fail-closed
        run: |
          set -eu
          contract_report=app/build/reports/independent-witness-verification-contract.txt
          test -f "${contract_report}"
          grep -qx 'checkpoint=19T' "${contract_report}"
          grep -qx 'witness_independence_established=false' "${contract_report}"
          grep -qx 'independent_witness_approval=false' "${contract_report}"
          grep -qx 'authority=UNTRUSTED_CANDIDATE_ONLY' "${contract_report}"
          grep -qx 'runtime_authorization=false' "${contract_report}"
          grep -qx 'trusted_expectation_minted=false' "${contract_report}"
          grep -qx 'hardware_validation_approved=false' "${contract_report}"
          grep -qx 'hardware_test_performed=false' "${contract_report}"
          grep -qx 'verification_authorizes_hardware_test=false' "${contract_report}"
          grep -qx 'verification_authorizes_wipe=false' "${contract_report}"
          grep -qx 'local_receipt_is_independent_witness=false' "${contract_report}"
          grep -qx 'ci_is_independent_witness=false' "${contract_report}"
          grep -qx 'operator_is_independent_witness=false' "${contract_report}"
          if grep -qE '\b[0-9a-fA-F]{64}\b' "${contract_report}"; then
            echo "Independent-witness contract report must not contain a digest value"
            exit 1
          fi
          test ! -e local/independent-witness-verification.txt
          test ! -e local/signed-validation-candidate-receipt.txt
          test ! -e app/build/tmp/independent-witness-verification-snapshot
          test ! -e app/build/tmp/independent-witness-verification-contract

      - name: Prove candidate-evidence task-private snapshots were deleted
        run: |
          set -eu
          test ! -e app/build/tmp/destructive-validation-explicit-candidate-snapshot
          test ! -e app/build/tmp/destructive-validation-unsigned-release-snapshot
          test ! -e app/build/tmp/destructive-validation-disposable-purpose-snapshot
          test ! -e app/build/tmp/destructive-validation-candidate-snapshot
          test ! -e app/build/tmp/signed-disposable-validation-snapshot
          test ! -e app/build/tmp/signed-validation-receipt-snapshot
          test ! -e app/build/tmp/independent-witness-verification-snapshot
          test ! -e app/build/tmp/independent-witness-verification-contract
          test ! -e app/build/tmp/destructive-validation-explicit-candidate-snapshot/immutable-candidate-snapshot.apk
          test ! -e app/build/tmp/destructive-validation-unsigned-release-snapshot/immutable-candidate-snapshot.apk
          test ! -e app/build/tmp/destructive-validation-disposable-purpose-snapshot/immutable-candidate-snapshot.apk
          test ! -e app/build/tmp/signed-disposable-validation-snapshot/immutable-candidate-snapshot.apk
          test ! -e app/build/tmp/signed-validation-receipt-snapshot/immutable-candidate-snapshot.apk
          test ! -e app/build/tmp/independent-witness-verification-snapshot/immutable-candidate-snapshot.apk
          test ! -e local/signed-validation-candidate-receipt.txt
          test ! -e local/independent-witness-verification.txt
